name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m build
      - run: dcf --output outputs/weg-dcf.xlsx --charts-dir outputs/charts --samples 1000
      - name: Execute reproducible research notebook
        run: python scripts/reproduce.py
      - uses: actions/upload-artifact@v4
        with:
          name: research-${{ matrix.python-version }}
          path: outputs/
