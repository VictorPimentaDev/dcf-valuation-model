[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dcf-valuation-model"
version = "0.1.0"
description = "DCF didático da WEG, com premissas auditáveis e Excel editável"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "openpyxl>=3.1,<4", "numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2",
  "matplotlib>=3.9,<4", "numpy-financial>=1,<2", "yfinance>=0.2.50,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10", "ruff>=0.13,<1", "build>=1,<2",
  "jupyter>=1,<2", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8",
]

[project.scripts]
dcf = "dcf_valuation.cli:main"

[tool.setuptools.package-data]
dcf_valuation = ["data/*.json", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
